<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEMBOI CALCULATOR</title>
<meta name="description" content="KEMBOI CALCULATOR: a scientific calculator with trig, logs, powers, memory and history.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EEF2F5; --grid:#D5DEE6; --ink:#14263A; --paper:#fff; --text:#14263A; --muted:#5B6B7B;
  --lcd:#D9E6DC; --lcd-ink:#10231B; --num:#F1F4F7; --num-ink:#14263A; --fn:#2C4A66; --fn-ink:#EAF1F7;
  --op:#F4B23E; --op-ink:#2A1C00; --eq:#19C3A5; --eq-ink:#04251F; --ac:#E5604D; --ac-ink:#fff; --line:#C9D3DC;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --sans:"IBM Plex Sans",system-ui,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--page:#0C1620; --grid:#14222F; --paper:#111F2C; --text:#E3ECF3; --muted:#8CA0B2; --line:#25384A}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; font-family:var(--sans); color:var(--text); background-color:var(--page);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; padding:24px 16px;
}
.wrap{max-width:820px; margin:0 auto; display:grid; grid-template-columns:minmax(0,400px) minmax(0,1fr); gap:20px; align-items:start; justify-content:center}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,420px)}}
.calc{background:var(--ink); border-radius:20px; padding:16px; box-shadow:0 18px 40px rgba(10,25,40,.28)}
.top{display:flex; justify-content:space-between; align-items:center; margin:2px 4px 12px}
h1{margin:0; font-size:1.05rem; font-weight:600; letter-spacing:.14em; color:#EAF1F7}
#mem{font:600 .8rem var(--mono); color:var(--op); border:1px solid var(--op); border-radius:6px; padding:1px 7px}
.screen{background:var(--lcd); color:var(--lcd-ink); border-radius:12px; padding:12px 14px; min-height:104px; display:flex; flex-direction:column; justify-content:space-between; font-family:var(--mono); box-shadow:inset 0 2px 6px rgba(0,0,0,.18)}
.expr{font-size:1.45rem; line-height:1.3; text-align:right; overflow-wrap:anywhere; max-height:4.2em; overflow:auto}
.expr::after{content:""; display:inline-block; width:2px; height:1.1em; background:currentColor; margin-left:2px; vertical-align:text-bottom; animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.res{font-size:1rem; text-align:right; min-height:1.4em; opacity:.75; overflow-wrap:anywhere}
.res.err{color:#9B2412; opacity:1}
.pad{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:14px}
.pad button{font:500 1.02rem var(--mono); border:0; border-radius:11px; padding:0; height:48px; cursor:pointer; transition:transform .06s, filter .12s}
.pad button:active{transform:translateY(1px) scale(.98)}
.pad button:hover{filter:brightness(1.08)}
button:focus-visible{outline:3px solid #fff; outline-offset:2px}
.num{background:var(--num); color:var(--num-ink); font-weight:600!important}
.fn{background:var(--fn); color:var(--fn-ink); font-size:.92rem!important}
.fn.on{background:var(--op); color:var(--op-ink)}
.op{background:var(--op); color:var(--op-ink)}
.eq{background:var(--eq); color:var(--eq-ink); font-weight:600!important}
.ac{background:var(--ac); color:var(--ac-ink)}
.hist{background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:14px 16px; max-height:560px; display:flex; flex-direction:column}
.hh{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}
h2{margin:0; font-size:1rem; font-weight:600}
#clr{background:none; border:1px solid var(--line); color:var(--muted); border-radius:8px; padding:4px 10px; font:inherit; font-size:.85rem; cursor:pointer}
#clr:focus-visible,.item:focus-visible{outline:3px solid var(--fn); outline-offset:2px}
#list{list-style:none; margin:0; padding:0; overflow:auto}
.item{display:block; width:100%; text-align:right; background:none; border:0; border-top:1px solid var(--line); padding:10px 2px; cursor:pointer; color:var(--text); font-family:var(--mono)}
.item small{display:block; color:var(--muted); font-size:.82rem; overflow-wrap:anywhere}
.item b{font-size:1.05rem; font-weight:500; overflow-wrap:anywhere}
.empty{color:var(--muted); font-size:.92rem; margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.expr::after{animation:none}.pad button{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="calc" aria-label="KEMBOI CALCULATOR">
    <div class="top"><h1>KEMBOI CALCULATOR</h1><span id="mem" hidden title="Value stored in memory">M</span></div>
    <div class="screen" aria-live="polite"><div id="expr" class="expr">0</div><div id="res" class="res"></div></div>
    <div id="pad" class="pad"></div>
  </section>
  <aside class="hist" aria-label="History">
    <div class="hh"><h2>History</h2><button id="clr" type="button">Clear history</button></div>
    <ul id="list"></ul>
  </aside>
</main>

<script>
(() => {
  const S = { expr: "", deg: true, second: false, mem: 0, ans: 0, fresh: false, hist: [] };
  const $ = id => document.getElementById(id);

  /* ---------- Calculation engine (safe parser, no eval) ---------- */
  const toRad = x => (S.deg ? x * Math.PI / 180 : x);
  const fromRad = x => (S.deg ? x * 180 / Math.PI : x);
  const zero = v => (Math.abs(v) < 1e-12 ? 0 : v);
  const dom = c => { if (c) throw new Error("Domain error"); };
  const F = {
    sin: x => zero(Math.sin(toRad(x))),
    cos: x => zero(Math.cos(toRad(x))),
    tan: x => { const c = Math.cos(toRad(x)); dom(Math.abs(c) < 1e-12); return zero(Math.tan(toRad(x))); },
    asin: x => { dom(Math.abs(x) > 1); return fromRad(Math.asin(x)); },
    acos: x => { dom(Math.abs(x) > 1); return fromRad(Math.acos(x)); },
    atan: x => fromRad(Math.atan(x)),
    log: x => { dom(x <= 0); return Math.log10(x); },
    ln: x => { dom(x <= 0); return Math.log(x); },
    sqrt: x => { dom(x < 0); return Math.sqrt(x); },
    cbrt: x => Math.cbrt(x),
    abs: x => Math.abs(x)
  };
  const fact = v => {
    if (v < 0 || !Number.isInteger(v) || v > 170) throw new Error("Factorial needs a whole number from 0 to 170");
    let r = 1; for (let i = 2; i <= v; i++) r *= i; return r;
  };

  function tokenize(s) {
    s = s.replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-").replace(/\s+/g, "");
    const out = []; let i = 0, m;
    while (i < s.length) {
      const r = s.slice(i);
      if ((m = r.match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i))) out.push({ n: parseFloat(m[0]) });
      else if ((m = r.match(/^(asin|acos|atan|sin|cos|tan|log|ln|sqrt|cbrt|abs|ans|pi|e)/i))) out.push({ id: m[0].toLowerCase() });
      else if (r[0] === "π") { m = ["π"]; out.push({ id: "pi" }); }
      else if ("+-*/^!%()".includes(r[0])) { m = [r[0]]; out.push({ op: r[0] }); }
      else throw new Error('Unexpected "' + r[0] + '"');
      i += m[0].length;
    }
    return out;
  }

  function evaluate(src) {
    const open = (src.match(/\(/g) || []).length - (src.match(/\)/g) || []).length;
    const t = tokenize(src + ")".repeat(Math.max(0, open)));
    let p = 0;
    const isOp = o => t[p] && t[p].op === o;
    function expr() {
      let v = term();
      while (isOp("+") || isOp("-")) { const o = t[p++].op, r = term(); v = o === "+" ? v + r : v - r; }
      return v;
    }
    function term() {
      let v = unary();
      for (;;) {
        if (isOp("*") || isOp("/")) {
          const o = t[p++].op, r = unary();
          if (o === "/" && r === 0) throw new Error("Cannot divide by zero");
          v = o === "*" ? v * r : v / r;
        } else if (t[p] && (t[p].n !== undefined || t[p].id || isOp("("))) v *= unary(); // implicit multiplication: 2π, 3(4+1)
        else return v;
      }
    }
    function unary() {
      if (isOp("-")) { p++; return -unary(); }
      if (isOp("+")) { p++; return unary(); }
      return power();
    }
    function power() {
      const b = post();
      if (isOp("^")) { p++; return Math.pow(b, unary()); }
      return b;
    }
    function post() {
      let v = prim();
      while (isOp("!") || isOp("%")) { v = t[p++].op === "!" ? fact(v) : v / 100; }
      return v;
    }
    function prim() {
      const k = t[p++];
      if (!k) throw new Error("Incomplete expression");
      if (k.n !== undefined) return k.n;
      if (k.op === "(") { const v = expr(); if (!isOp(")")) throw new Error("Missing )"); p++; return v; }
      if (k.id === "pi") return Math.PI;
      if (k.id === "e") return Math.E;
      if (k.id === "ans") return S.ans;
      if (k.id) {
        if (!isOp("(")) throw new Error("Missing ( after " + k.id);
        p++; const a = expr(); if (!isOp(")")) throw new Error("Missing )"); p++;
        return F[k.id](a);
      }
      throw new Error('Unexpected "' + k.op + '"');
    }
    const v = expr();
    if (p < t.length) throw new Error('Unexpected "' + (t[p].op || t[p].id || t[p].n) + '"');
    if (!Number.isFinite(v)) throw new Error("Math error");
    return v;
  }

  function fmt(x) {
    if (x === 0) return "0";
    const a = Math.abs(x);
    if (a >= 1e12 || a < 1e-9) return x.toExponential(9).replace(/\.?0+e/, "e");
    return String(parseFloat(x.toPrecision(12)));
  }

  /* ---------- UI state ---------- */
  const startsFresh = v => !/^[+−×÷^!%]/.test(v);
  function ins(v) {
    if (S.fresh) { if (startsFresh(v)) S.expr = ""; S.fresh = false; }
    S.expr += v;
    render();
  }
  function del() { if (S.fresh) { S.expr = ""; S.fresh = false; } else S.expr = S.expr.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|sqrt\(|cbrt\(|abs\(|Ans|.)$/, ""); render(); }
  function ac() { S.expr = ""; S.fresh = false; render(); }
  function tryEval() { try { return { v: evaluate(S.expr) }; } catch (e) { return { err: e.message }; } }

  function equals() {
    if (!S.expr) return;
    const r = tryEval();
    if (r.err) { $("res").textContent = r.err; $("res").className = "res err"; return; }
    const out = fmt(r.v);
    S.hist.unshift({ e: S.expr, r: out });
    S.hist = S.hist.slice(0, 40);
    S.ans = r.v; S.expr = out; S.fresh = true;
    save(); render();
  }

  function memory(kind) {
    if (kind === "mc") S.mem = 0;
    else if (kind === "mr") { ins(fmt(S.mem)); return; }
    else {
      const r = tryEval();
      if (r.err) { $("res").textContent = r.err; $("res").className = "res err"; return; }
      S.mem += kind === "mp" ? r.v : -r.v;
    }
    render();
  }

  /* ---------- Keypad ---------- */
  // [label, 2nd label, action, class]; action starting with "@" is a command, otherwise text to insert
  const KEYS = [
    ["MC", , "@mc", "fn"], ["MR", , "@mr", "fn"], ["M+", , "@mp", "fn"], ["M−", , "@mm", "fn"], ["DEG", , "@deg", "fn"],
    ["2nd", , "@2nd", "fn"], ["sin", "sin⁻¹", "sin(", "fn", "asin("], ["cos", "cos⁻¹", "cos(", "fn", "acos("], ["tan", "tan⁻¹", "tan(", "fn", "atan("], ["π", , "π", "fn"],
    ["√", "∛", "sqrt(", "fn", "cbrt("], ["x²", "x³", "^2", "fn", "^3"], ["xʸ", , "^", "fn"], ["log", "10ˣ", "log(", "fn", "10^("], ["ln", "eˣ", "ln(", "fn", "e^("],
    ["(", , "(", "fn"], [")", , ")", "fn"], ["n!", , "!", "fn"], ["%", , "%", "fn"], ["⌫", , "@del", "ac"],
    ["7", , "7", "num"], ["8", , "8", "num"], ["9", , "9", "num"], ["÷", , "÷", "op"], ["AC", , "@ac", "ac"],
    ["4", , "4", "num"], ["5", , "5", "num"], ["6", , "6", "num"], ["×", , "×", "op"], ["1/x", , "^(−1)", "fn"],
    ["1", , "1", "num"], ["2", , "2", "num"], ["3", , "3", "num"], ["−", , "−", "op"], ["e", , "e", "fn"],
    ["0", , "0", "num"], [".", , ".", "num"], ["Ans", , "Ans", "fn"], ["+", , "+", "op"], ["=", , "@eq", "eq"]
  ];
  const pad = $("pad");
  const btns = KEYS.map(k => {
    const b = document.createElement("button");
    b.type = "button"; b.className = k[3]; b.textContent = k[0];
    b.addEventListener("click", () => act(k));
    pad.appendChild(b);
    return b;
  });
  function act(k) {
    const a = S.second && k[4] ? k[4] : k[2];
    switch (a) {
      case "@eq": return equals();
      case "@ac": return ac();
      case "@del": return del();
      case "@2nd": S.second = !S.second; return render();
      case "@deg": S.deg = !S.deg; return render();
      case "@mc": return memory("mc");
      case "@mr": return memory("mr");
      case "@mp": return memory("mp");
      case "@mm": return memory("mm");
      default:
        ins(a);
        if (S.second && k[4]) { S.second = false; render(); }
    }
  }

  /* ---------- Render ---------- */
  function render() {
    $("expr").textContent = S.expr || "0";
    const res = $("res"); res.className = "res";
    if (S.expr && !S.fresh && /[+\-−×÷^!%(]|[a-z]/.test(S.expr)) {
      const r = tryEval();
      res.textContent = r.err ? "" : "= " + fmt(r.v);
    } else res.textContent = "";
    $("mem").hidden = S.mem === 0;
    KEYS.forEach((k, i) => {
      if (k[2] === "@deg") btns[i].textContent = S.deg ? "DEG" : "RAD";
      else if (k[2] === "@2nd") btns[i].classList.toggle("on", S.second);
      else if (k[4]) btns[i].textContent = S.second ? k[1] : k[0];
    });
    const list = $("list"); list.innerHTML = "";
    if (!S.hist.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "Your calculations will appear here."; list.appendChild(p); }
    S.hist.forEach(h => {
      const li = document.createElement("li"), b = document.createElement("button");
      b.type = "button"; b.className = "item"; b.title = "Use this result";
      b.innerHTML = "<small></small><b></b>";
      b.firstChild.textContent = h.e + " =";
      b.lastChild.textContent = h.r;
      b.addEventListener("click", () => { S.expr = h.r; S.fresh = true; render(); });
      li.appendChild(b); list.appendChild(li);
    });
  }

  function save() { try { localStorage.setItem("kemboi-calc-history", JSON.stringify(S.hist)); } catch (e) {} }
  try { const h = JSON.parse(localStorage.getItem("kemboi-calc-history") || "[]"); if (Array.isArray(h)) S.hist = h.slice(0, 40); } catch (e) {}
  $("clr").addEventListener("click", () => { S.hist = []; save(); render(); });

  /* ---------- Keyboard ---------- */
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const map = { "*": "×", "/": "÷", "-": "−" };
    const k = e.key;
    if (/^[0-9.+^()%!]$/.test(k) || map[k]) { e.preventDefault(); ins(map[k] || k); }
    else if (k === "Enter" || k === "=") { e.preventDefault(); equals(); }
    else if (k === "Backspace") { e.preventDefault(); del(); }
    else if (k === "Escape") { e.preventDefault(); ac(); }
  });

  render();
})();
</script>
</body>
</html>
